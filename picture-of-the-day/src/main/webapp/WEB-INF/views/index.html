<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{app.title}">Picture of the Day</title>
</head>
<body>
<img id="img-of-the-day" alt="Picture of the day" style="max-width: 800px; display: block; margin-bottom: 10px;">

<form th:action="@{/comment}" th:object="${comment}" method="post">
    <div>
        <select th:field="*{rate}">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </div>
    <div>
        <label th:text="#{form.author}">Author:</label><br>
        <input type="text" th:field="*{author}">
    </div>
    <div>
        <label th:text="#{form.feedback}">Feedback:</label><br>
        <textarea th:field="*{feedback}" rows="5" cols="60"></textarea>
    </div>
    <div style="margin-top: 5px;">
        <button type="submit" th:text="#{form.submit}">Comment</button>
    </div>
</form>

<hr style="margin-top: 20px;">

<div th:each="c : ${comments}">
    <p style="font-size: 18px; margin-bottom: 5px;" th:text="'+' + ${c.rate} + ' ' + ${c.feedback}"></p>
    <p style="margin-top: 0;">
        <span th:text="${c.likes}"></span> likes |
        <a th:href="@{/like/{id}(id=${c.id})}">Like</a>
    </p>
    <hr>
</div>

<script>
    let query = 'https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY';
    let request = new XMLHttpRequest();
    request.open('GET', query);
    request.onload = function() {
        if (request.status === 200) {
            let response = JSON.parse(request.responseText);
            document.getElementById('img-of-the-day').setAttribute('src', response.url);
        }
    };
    request.send();
</script>
</body>
</html>
