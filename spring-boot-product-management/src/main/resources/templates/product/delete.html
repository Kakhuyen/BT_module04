<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Product</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .warning { color: red; }
        table { margin-top: 15px; background: #fff3f3; padding: 15px; }
        td { padding: 8px; }
    </style>
</head>
<body>
<h1>Delete Product</h1>
<h2 class="warning">Are you sure you want to delete this product?</h2>
<p><a href="/products">← Back to product list</a></p>

<form th:action="@{/products/delete}" th:object="${product}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <table>
        <tr>
            <td>Name:</td>
            <td th:text="*{name}"></td>
        </tr>
        <tr>
            <td>Price:</td>
            <td th:text="*{price}"></td>
        </tr>
        <tr>
            <td>Description:</td>
            <td th:text="*{description}"></td>
        </tr>
        <tr>
            <td>Manufacturer:</td>
            <td th:text="*{manufacturer}"></td>
        </tr>
        <tr>
            <td colspan="2">
                <input type="submit" value="Delete Product" style="background: red; color: white; border: none; padding: 10px; cursor: pointer;"/>
            </td>
        </tr>
    </table>
</form>
</body>
</html>
