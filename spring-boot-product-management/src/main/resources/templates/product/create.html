<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Create Product</title></head>
<body>
<h1>Create Product</h1>
<p><a href="/products">Back to list</a></p>
<p style="color: green;" th:if="${message}" th:text="${message}"></p>

<form th:action="@{/products/create}" th:object="${product}" method="post">
    Name: <input type="text" th:field="*{name}"/><br/>
    Price: <input type="number" step="0.01" th:field="*{price}"/><br/>
    Description: <input type="text" th:field="*{description}"/><br/>
    Manufacturer: <input type="text" th:field="*{manufacturer}"/><br/>
    <input type="submit" value="Save"/>
</form>
</body>
</html>
