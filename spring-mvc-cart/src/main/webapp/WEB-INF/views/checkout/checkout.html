<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>
        Checkout Information
    </h2>

    <form action="/checkout"
          method="post">

        <div class="mb-3">

            <label class="form-label">

                Full Name

            </label>

            <input type="text"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">

                Address

            </label>

            <input type="text"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">

                Phone

            </label>

            <input type="text"
                   class="form-control">

        </div>

        <button class="btn btn-success">

            Confirm Order

        </button>

    </form>

</div>

</body>
</html>
