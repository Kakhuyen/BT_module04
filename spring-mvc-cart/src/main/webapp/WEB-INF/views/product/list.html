<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
<div class="container mt-4">
    <h4 class="text-danger text-uppercase border-bottom pb-2 mb-4">Danh sách sản phẩm</h4>
    <div class="row g-0 border-top border-start">
        <div class="col-md-3 border-end border-bottom p-4 text-center position-relative" th:each="product : ${products}">
            <span class="badge bg-danger position-absolute top-0 end-0 m-2 px-3 py-2">NEW!</span>

            <img th:src="${product.image != null ? product.image : 'https://via.placeholder.com/250'}" class="img-fluid mb-3" alt="Product">

            <div class="text-secondary mb-2" th:text="${product.name}">Sản phẩm</div>

            <div>
                <span class="text-decoration-line-through text-muted me-2">400.000 đ</span>
                <span class="text-danger fw-bold fs-5" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">350.000 đ</span>
            </div>

            <a th:href="@{/product/{id}(id=${product.id})}" class="stretched-link"></a>
        </div>
    </div>
</div>
</body>
</html>
