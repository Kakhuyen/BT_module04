<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 col-lg-8">

    <div class="nav nav-pills nav-fill bg-secondary bg-opacity-10 mb-4 rounded-0">
        <div class="nav-item">
            <a class="nav-link active bg-info rounded-0 fw-bold py-3 fs-5" href="#">01. Giỏ hàng</a>
        </div>
        <div class="nav-item">
            <a class="nav-link text-muted py-3 fs-5" href="#">02. Đơn hàng</a>
        </div>
        <div class="nav-item">
            <a class="nav-link text-muted py-3 fs-5" href="#">03. Thanh toán</a>
        </div>
    </div>

    <div class="border p-3 fw-bold text-uppercase bg-white">
        GIỎ HÀNG (<span th:text="${cart.countItemQuantity()}">2</span>)
    </div>

    <div th:each="item : ${cart.items}" class="border border-top-0 p-3 bg-white position-relative">
        <a th:href="@{/remove/{id}(id=${item.product.id})}" class="btn btn-dark btn-sm position-absolute top-0 start-0 m-3 rounded-0 px-2 py-0 fs-4 lh-1" title="Xóa sản phẩm">&times;</a>

        <div class="row g-0 align-items-center ms-5">
            <div class="col-4 col-md-3 col-lg-2">
                <img th:src="${item.product.image != null ? item.product.image : 'https://via.placeholder.com/150'}" class="img-fluid img-thumbnail border-0" alt="Product">
            </div>

            <div class="col-8 col-md-9 col-lg-10 ps-4">
                <div class="text-danger fs-5 fw-medium mb-1" th:text="${item.product.name}">Sản phẩm 1</div>

                <div class="row mb-1">
                    <div class="col-3 text-muted">Mã SP:</div>
                    <div class="col-9 text-success" th:text="${item.product.id}">4564</div>
                </div>

                <div class="row mb-1">
                    <div class="col-3 text-muted">Đơn giá:</div>
                    <div class="col-9 text-dark" th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">350.000 đ</div>
                </div>

                <div class="row align-items-center mt-2">
                    <div class="col-3 text-muted">Số lượng:</div>
                    <div class="col-9">
                        <select class="form-select form-select-sm w-auto d-inline-block" th:onchange="'window.location.href=\'/add/' + ${item.product.id} + '?action=show\''">
                            <option th:each="i : ${#numbers.sequence(1, 10)}"
                                    th:value="${i}"
                                    th:text="${i}"
                                    th:selected="${i == item.quantity}">
                            </option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="border border-top-0 p-4 bg-white d-flex align-items-center" th:if="${cart.countItemQuantity() > 0}">
        <div class="text-danger fw-bold fs-5 ms-md-5 ps-md-5 me-4">Tổng cộng:</div>
        <div class="text-dark fw-bold fs-5" th:text="${#numbers.formatDecimal(cart.countTotalPayment(), 0, 'COMMA', 0, 'POINT')} + ' đ'">1.480.000 đ</div>
    </div>

    <div class="text-end mt-4">
        <form action="/checkout" method="post">
            <button type="submit" class="btn btn-info text-white px-5 py-2 fw-bold rounded-0 fs-5">TIẾP TỤC THANH TOÁN</button>
        </form>
    </div>
</div>
</body>
</html>
