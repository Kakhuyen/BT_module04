<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="/layout :: head">
    <title>UpdateCustomer</title>
</head>
<body>
<div class="container mt-4">
    <h3 class="bg-primary text-white p-2 mb-4">Update Customer</h3>
    <p>
        <a th:href="@{/customers}" class="btn btn-secondary btn-sm">Back to customer list</a>
    </p>
    <div class="col-md-6">
        <form th:action="@{/customers/update}" th:object="${customer}" method="POST" novalidate="novalidate">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" th:field="*{name}"/>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" th:field="*{email}"/>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" id="address" class="form-control" th:field="*{address}"/>
            </div>
            <button type="submit" class="btn btn-warning">Edit</button>
        </form>
    </div>
</div>
<footer th:replace="/layout :: footer"></footer>
</body>
</html>
