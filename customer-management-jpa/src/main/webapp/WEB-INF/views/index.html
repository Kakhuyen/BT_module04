<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="/layout :: head">
    <title>ListCustomer</title>
</head>
<body>
<div class="container mt-4">
    <h3 class="bg-primary text-white p-2 mb-4">Customers</h3>

    <p>
        <a th:href="@{/customers/create}" class="btn btn-primary btn-sm">
            + Add new customer
        </a>
    </p>

    <div th:if="${success}">
        <span class="alert alert-success d-block p-2" th:text="${success}"></span>
    </div>
    <div th:if="${errorMessage}">
        <span class="alert alert-danger d-block p-2" th:text="${errorMessage}"></span>
    </div>

    <table class="table table-striped table-bordered mt-3 align-middle">
        <thead class="table-success">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Address</th>
            <th>Edit</th>
            <th>Delete</th>
            <th>View</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row,rowStat : ${customers}">
            <td th:text="${row.name}"></td>
            <td th:text="${row.email}"></td>
            <td th:text="${row.address}"></td>
            <td style="width: 1%; white-space: nowrap;">
                <a th:href="@{/customers/{id}/edit(id=${row.id})}" class="btn btn-warning btn-sm text-dark fw-bold">Edit</a>
            </td>
            <td style="width: 1%; white-space: nowrap;">
                <a th:href="@{/customers/{id}/delete(id=${row.id})}" class="btn btn-danger btn-sm text-white fw-bold">Delete</a>
            </td>
            <td style="width: 1%; white-space: nowrap;">
                <a th:href="@{/customers/{id}/view(id=${row.id})}" class="btn btn-info btn-sm text-white fw-bold">View</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<footer th:replace="/layout :: footer"></footer>
</body>
</html>
