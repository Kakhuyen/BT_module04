<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Danh sách bài hát</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Danh sách bài hát</h2>
        <a href="/songs/create" class="btn btn-success">Thêm bài hát mới</a>
    </div>

    <table class="table table-bordered table-hover bg-white text-center align-middle">
        <thead class="table-dark">
        <tr>
            <th>Tên bài hát</th>
            <th>Nghệ sĩ</th>
            <th>Thể loại</th>
            <th>Nghe nhạc</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="song : ${songs}">
            <td class="fw-bold" th:text="${song.name}"></td>
            <td th:text="${song.artist}"></td>
            <td th:text="${song.genre}"></td>
            <td>
                <audio controls>
                    <source th:src="@{'/audio/' + ${song.filePath}}" type="audio/mpeg">
                </audio>
            </td>
            <td>
                <a th:href="@{/songs/edit/{id}(id=${song.id})}" class="btn btn-warning btn-sm">Sửa</a>
                <a th:href="@{/songs/delete/{id}(id=${song.id})}" class="btn btn-danger btn-sm">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
