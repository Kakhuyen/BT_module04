<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật bài hát</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <h2 class="text-warning mb-4 text-center">Cập nhật thông tin</h2>
    <div class="card p-4 shadow-sm border-0">
        <form th:action="@{/songs/update}" th:object="${songForm}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên bài hát</label>
                <input type="text" class="form-control" th:field="*{name}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Nghệ sĩ</label>
                <input type="text" class="form-control" th:field="*{artist}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Thể loại</label>
                <input type="text" class="form-control" th:field="*{genre}" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">File nhạc (Để trống nếu không thay đổi)</label>
                <input type="file" class="form-control" th:field="*{file}" accept="audio/*">
                <small class="text-muted d-block mt-1">File hiện tại: <span th:text="${currentFile}"></span></small>
            </div>
            <button type="submit" class="btn btn-warning w-100">Cập nhật</button>
            <a href="/songs" class="btn btn-secondary w-100 mt-2">Quay lại</a>
        </form>
    </div>
</div>
</body>
</html>
