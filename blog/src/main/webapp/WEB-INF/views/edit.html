<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa Blog</title>
</head>
<body>
<h2>Chỉnh sửa bài viết</h2>
<p><a th:href="@{/blogs}">Quay lại danh sách</a></p>

<form th:action="@{/blogs/edit}" th:object="${blog}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <div>
        <label>Tiêu đề:</label><br>
        <input type="text" th:field="*{title}" required size="50"/>
    </div>
    <br>
    <div>
        <label>Tóm tắt:</label><br>
        <textarea th:field="*{summary}" rows="3" cols="52" required></textarea>
    </div>
    <br>
    <div>
        <label>Nội dung:</label><br>
        <textarea th:field="*{content}" rows="8" cols="52" required></textarea>
    </div>
    <br>
    <button type="submit">Cập nhật</button>
</form>
</body>
</html>
